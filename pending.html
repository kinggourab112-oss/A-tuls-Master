<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pending Approval | A-tuls</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 30% 0%, #12182b 0%, #060a12 60%);
    font-family:'Plus Jakarta Sans',sans-serif; color:#e8f7ff; padding:20px;
}
.card {
    max-width:440px; width:100%; text-align:center;
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
    border-radius:28px; padding:48px 32px; backdrop-filter:blur(20px);
}
.icon {
    width:80px; height:80px; margin:0 auto 24px;
    background:linear-gradient(135deg,rgba(0,240,255,0.15),rgba(123,47,255,0.15));
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:36px; color:#00f0ff;
}
h1 { font-size:1.6rem; margin-bottom:12px; }
p { color:#8b9cb3; font-size:15px; line-height:1.6; margin-bottom:20px; }
.status { font-size:13px; color:#00f0ff; margin-bottom:24px; }
.btn {
    display:inline-flex; align-items:center; gap:8px;
    padding:14px 28px; border-radius:14px; border:none;
    background:linear-gradient(135deg,#00f0ff,#00b8d4); color:#000;
    font-weight:700; font-size:15px; cursor:pointer;
}
</style>
</head>
<body>
<div class="card">
    <div class="icon"><i class="fas fa-clock"></i></div>
    <h1>অ্যাকাউন্ট পেন্ডিং</h1>
    <p>আপনার রেজিস্ট্রেশন সফল হয়েছে।<br>
    অ্যাডমিন আপনার অ্যাকাউন্ট অ্যাপ্রুভ করলে আপনি সব টুল ব্যবহার করতে পারবেন।<br><br>
    অনুগ্রহ করে অপেক্ষা করুন।</p>
    <div class="status" id="statusText">স্ট্যাটাস চেক হচ্ছে...</div>
    <button class="btn" onclick="location.href='index.html'">
        <i class="fas fa-arrow-left"></i> Back to Login
    </button>
</div>

<script>
const BIN_ID = '6a6eb29dda38895dfeae700a';
const MASTER_KEY = '$2a$10$GzWaV3W/AAwOB454.aieN.f04H/PIoDF0RFCqAUPrNxIr0OGg13qW';
const BIN_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;

const role = localStorage.getItem('a_tuls_role');
const user = JSON.parse(localStorage.getItem('a_tuls_user') || '{}');

if (role === 'user' || role === 'admin') {
    location.href = role === 'admin' ? 'admin.html' : 'dashboard.html';
}

async function checkStatus() {
    try {
        const res = await fetch(BIN_URL + '/latest', {
            headers: { 'X-Master-Key': MASTER_KEY }
        });
        if (!res.ok) return;
        const data = await res.json();
        const db = data.record || {};
        const users = db.users || [];
        const fresh = users.find(u => (u.email || '').toLowerCase() === (user.email || '').toLowerCase());

        if (!fresh) {
            document.getElementById('statusText').textContent = 'অ্যাকাউন্ট পাওয়া যায়নি। আবার রেজিস্টার করুন।';
            return;
        }

        if (fresh.status === 'Approved') {
            localStorage.setItem('a_tuls_role', 'user');
            localStorage.setItem('a_tuls_user', JSON.stringify(fresh));
            document.getElementById('statusText').textContent = '✅ অ্যাপ্রুভড! ড্যাশবোর্ডে যাচ্ছে...';
            setTimeout(() => location.href = 'dashboard.html', 800);
            return;
        }

        if (fresh.status === 'Blocked') {
            document.getElementById('statusText').textContent = '⛔ অ্যাকাউন্ট ব্লক করা হয়েছে।';
            localStorage.removeItem('a_tuls_role');
            localStorage.removeItem('a_tuls_user');
            return;
        }

        document.getElementById('statusText').textContent = 'অপেক্ষা করুন... (অটো চেক চলছে)';
    } catch (e) {
        document.getElementById('statusText').textContent = 'নেটওয়ার্ক চেক করুন...';
    }
}

checkStatus();
setInterval(checkStatus, 5000);
</script>
</body>
</html>
