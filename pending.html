<script>
const BIN_ID = '6a6eb29dda38895dfeae700a';
const MASTER_KEY = '$2a$10$GzWaV3W/AAwOB454.aieN.f04H/PIoDF0RFCqAUPrNxIr0OGg13qW';
const BIN_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;

const role = localStorage.getItem('a_tuls_role');
const user = JSON.parse(localStorage.getItem('a_tuls_user') || '{}');

if (role === 'user' || role === 'admin') {
    location.href = role === 'admin' ? 'admin.html' : 'dashboard.html';
}

/* Device fingerprint for block check */
function simpleHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
    }
    return Math.abs(h).toString(36);
}

function getFingerprint() {
    const parts = [
        navigator.userAgent,
        navigator.language,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || 0,
        navigator.platform || ''
    ].join('|');
    return simpleHash(parts);
}

async function checkStatus() {
    try {
        const res = await fetch(BIN_URL + '/latest', {
            headers: { 'X-Master-Key': MASTER_KEY }
        });
        if (!res.ok) return;
        const data = await res.json();
        const db = data.record || {};
        const users = db.users || [];
        const fresh = users.find(u => (u.email || '').toLowerCase() === (user.email || '').toLowerCase());

        if (!fresh) {
            document.getElementById('statusText').textContent = 'অ্যাকাউন্ট পাওয়া যায়নি। আবার রেজিস্টার করুন।';
            return;
        }

        // Device block check
        const fp = getFingerprint();
        if (Array.isArray(fresh.blockedDevices) && fresh.blockedDevices.includes(fp)) {
            document.getElementById('statusText').textContent = '⛔ এই ডিভাইস Admin কর্তৃক ব্লক করা হয়েছে।';
            localStorage.removeItem('a_tuls_role');
            localStorage.removeItem('a_tuls_user');
            return;
        }

        if (fresh.status === 'Approved') {
            localStorage.setItem('a_tuls_role', 'user');
            localStorage.setItem('a_tuls_user', JSON.stringify(fresh));
            document.getElementById('statusText').textContent = '✅ অ্যাপ্রুভড! ড্যাশবোর্ডে যাচ্ছে...';
            setTimeout(() => location.href = 'dashboard.html', 800);
            return;
        }

        if (fresh.status === 'Blocked') {
            document.getElementById('statusText').textContent = '⛔ অ্যাকাউন্ট ব্লক করা হয়েছে।';
            localStorage.removeItem('a_tuls_role');
            localStorage.removeItem('a_tuls_user');
            return;
        }

        document.getElementById('statusText').textContent = 'অপেক্ষা করুন... (অটো চেক চলছে)';
        try {
            const tg = (db.settings && db.settings.adminInfo && db.settings.adminInfo.telegram) || '';
            // Keep fixed number 01336-489062 as requested; only refresh prefilled text with user email
            const btn = document.getElementById('msgAdminBtn');
            if (btn && user && user.email) {
                const msg = encodeURIComponent('Assalamu Alaikum Admin, amar account pending ache. Email: ' + user.email + '. Please approve koren.');
                btn.href = 'https://wa.me/8801336489062?text=' + msg;
            }
        } catch (e) {}
    } catch (e) {
        document.getElementById('statusText').textContent = 'নেটওয়ার্ক চেক করুন...';
    }
}

checkStatus();
setInterval(checkStatus, 5000);
</script>
