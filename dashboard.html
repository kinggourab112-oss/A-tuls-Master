===================================================== */
:root, [data-theme="dark-ocean"] {
    --primary: #38bdf8;
    --primary2: #c084fc;
    --bg: #0b1424;
    --bg2: #152238;
    --card: rgba(56,189,248,0.08);
    --border: rgba(56,189,248,0.22);
    --text: #f8fafc;
    --muted: #a5b4c8;
    --side1: #0e1a32;
    --side2: #0a1220;
    --top: rgba(15,25,45,0.92);
    --notice-bg: rgba(0,240,255,0.1);
    --notice-bd: rgba(0,240,255,0.3);
    --notice-tx: #00f0ff;
    --danger-bg: rgba(255,59,92,0.15);
    --danger-tx: #ff3b5c;
    --danger-bd: rgba(255,59,92,0.3);
    --badge-bg: rgba(0,240,255,0.12);
    --badge-tx: #00f0ff;
    --shadow: 0 8px 32px rgba(0,0,0,0.45);
    --radius: 20px;
    --card-hover: translateY(-6px);
    --side-w: 270px;
    --font: 'Plus Jakarta Sans', sans-serif;
}

/* =====================================================
   THEME 2: NEON NIGHT
===================================================== */
[data-theme="neon-night"] {
    --primary: #f0abfc;
    --primary2: #67e8f9;
    --bg: #10041f;
    --bg2: #1e0a3a;
    --card: rgba(240,171,252,0.14);
    --border: rgba(240,171,252,0.4);
    --text: #fdf4ff;
    --muted: #e9d5ff;
    --side1: #2a0850;
    --side2: #120428;
    --top: rgba(28,8,48,0.94);
    --notice-bg: rgba(176,38,255,0.14);
    --notice-bd: rgba(176,38,255,0.4);
    --notice-tx: #d4a5ff;
    --danger-bg: rgba(255,59,92,0.18);
    --danger-tx: #ff6b8a;
    --danger-bd: rgba(255,59,92,0.35);
    --badge-bg: rgba(176,38,255,0.18);
    --badge-tx: #d4a5ff;
    --shadow: 0 0 40px rgba(176,38,255,0.2);
    --radius: 16px;
    --card-hover: translateY(-6px) scale(1.02);
    --side-w: 270px;
}

/* =====================================================
   THEME 3: GOLD PREMIUM
===================================================== */
[data-theme="gold-premium"] {
    --primary: #fcd34d;
    --primary2: #fb923c;
    --bg: #1c160a;
    --bg2: #2e2412;
    --card: rgba(252,211,77,0.14);
    --border: rgba(252,211,77,0.4);
    --text: #fffef5;
    --muted: #e7d29a;
    --side1: #3d2e08;
    --side2: #1a1408;
    --top: rgba(35,28,12,0.94);
    --notice-bg: rgba(255,200,0,0.12);
    --notice-bd: rgba(255,200,0,0.35);
    --notice-tx: #ffc800;
    --danger-bg: rgba(255,59,92,0.15);
    --danger-tx: #ff3b5c;
    --danger-bd: rgba(255,59,92,0.3);
    --badge-bg: rgba(255,200,0,0.14);
    --badge-tx: #ffc800;
    --shadow: 0 8px 32px rgba(255,200,0,0.12);
    --radius: 24px;
    --card-hover: translateY(-8px);
    --side-w: 280px;
}

/* =====================================================
   THEME 4: CYBER PUNK
===================================================== */
[data-theme="cyber-punk"] {
    --primary: #ff6bcb;
    --primary2: #5eead4;
    --bg: #160028;
    --bg2: #2a0050;
    --card: rgba(255,107,203,0.14);
    --border: rgba(94,234,212,0.4);
    --text: #f8fafc;
    --muted: #ddd6fe;
    --side1: #3b0066;
    --side2: #160028;
    --top: rgba(32,0,56,0.94);
    --notice-bg: rgba(0,240,255,0.1);
    --notice-bd: rgba(255,45,149,0.4);
    --notice-tx: #00f0ff;
    --danger-bg: rgba(255,59,92,0.18);
    --danger-tx: #ff3b5c;
    --danger-bd: rgba(255,59,92,0.35);
    --badge-bg: rgba(255,45,149,0.16);
    --badge-tx: #ff2d95;
    --shadow: 0 0 30px rgba(255,45,149,0.18);
    --radius: 8px;
    --card-hover: translateY(-4px) skewX(-1deg);
    --side-w: 260px;
}

/* =====================================================
   THEME 5: EMERALD LIGHT
===================================================== */
[data-theme="emerald-light"] {
    --primary: #0d9488;
    --primary2: #059669;
    --bg: #f0fdfa;
    --bg2: #ccfbf1;
    --card: #ffffff;
    --border: #5eead4;
    --text: #042f2e;
    --muted: #0f766e;
    --side1: #0f766e;
    --side2: #115e59;
    --top: #ffffff;
    --notice-bg: #ecfdf5;
    --notice-bd: #a7f3d0;
    --notice-tx: #047857;
    --danger-bg: #fef2f2;
    --danger-tx: #dc2626;
    --danger-bd: #fecaca;
    --badge-bg: #f0fdfa;
    --badge-tx: #0f766e;
    --shadow: 0 4px 20px rgba(0,0,0,0.06);
    --radius: 18px;
    --card-hover: translateY(-5px);
    --side-w: 270px;
}


/* ===== Theme polish ===== */
.card {
    backdrop-filter: blur(12px);
}
.card:hover {
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
}
[data-theme="emerald-light"] .card:hover {
    box-shadow: 0 12px 32px rgba(20,184,166,0.18);
}
.sidebar {
    box-shadow: 8px 0 40px rgba(0,0,0,0.35);
}
.topbar {
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
}
.page-title {
    letter-spacing: -0.5px;
}
.icon {
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
}

* { margin:0; padding:0; box-sizing:border-box; font-family: var(--font, 'Plus Jakarta Sans', sans-serif); }

body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    transition: background 0.4s ease, color 0.4s ease;
}

/* ========== SIDEBAR ========== */
.sidebar {
    width: var(--side-w);
    background: linear-gradient(180deg, var(--side1) 0%, var(--side2) 100%);
    color: #fff;
    height: 100vh;
    position: fixed;
    left: 0; top: 0;
    display: flex;
    flex-direction: column;
    z-index: 100;
    box-shadow: 4px 0 28px rgba(0,0,0,0.25);
    transition: transform 0.3s ease, width 0.35s ease, background 0.4s ease;
}

.sidebar-header {
    padding: 22px 18px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

.sidebar-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.2rem;
    font-weight: 800;
}

.sidebar-logo i {
    width: 42px; height: 42px;
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
}

.sidebar-menu {
    flex: 1;
    padding: 14px 10px;
    overflow-y: auto;
}

.menu-label {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    opacity: 0.5;
    padding: 12px 12px 6px;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 12px;
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-weight: 500;
    font-size: 13.5px;
    transition: 0.2s;
    margin-bottom: 2px;
    cursor: pointer;
}

.menu-item:hover, .menu-item.active {
    background: rgba(255,255,255,0.15);
    color: #fff;
}

.menu-item i { width: 20px; text-align: center; font-size: 14px; }

.sidebar-footer {
    padding: 12px 14px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 11.5px;
    opacity: 0.65;
    text-align: center;
}

/* Theme-specific sidebar accents */
[data-theme="neon-night"] .menu-item.active {
    background: linear-gradient(90deg, rgba(176,38,255,0.35), transparent);
    border-left: 3px solid #b026ff;
}
[data-theme="gold-premium"] .menu-item.active {
    background: linear-gradient(90deg, rgba(255,200,0,0.25), transparent);
    border-left: 3px solid #ffc800;
}
[data-theme="cyber-punk"] .menu-item.active {
    background: linear-gradient(90deg, rgba(255,45,149,0.3), transparent);
    border-left: 3px solid #00f0ff;
    border-radius: 4px;
}
[data-theme="cyber-punk"] .sidebar-logo i {
    border-radius: 4px;
    border: 1px solid rgba(0,240,255,0.4);
}

/* ========== MAIN ========== */
.main {
    margin-left: var(--side-w);
    flex: 1;
    min-height: 100vh;
    transition: margin-left 0.35s ease;
}

.topbar {
    background: var(--top);
    padding: 14px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(14px);
    transition: background 0.4s ease;
}

.topbar-left { display: flex; align-items: center; gap: 12px; }

.menu-toggle {
    display: none;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    width: 40px; height: 40px;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    color: var(--text);
}

.page-title {
    font-size: 1.2rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--primary), var(--primary2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.topbar-right { display: flex; align-items: center; gap: 12px; }

.user-badge {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--badge-bg);
    padding: 7px 13px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    color: var(--badge-tx);
    border: 1px solid var(--border);
}

.user-badge i {
    width: 28px; height: 28px;
    background: var(--primary);
    color: #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
}

[data-theme="emerald-light"] .user-badge i { color: #fff; }

.logout-btn {
    background: var(--danger-bg);
    color: var(--danger-tx);
    border: 1px solid var(--danger-bd);
    padding: 8px 13px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 12.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
}
.logout-btn:hover { opacity: 0.85; }

/* Notice */
.notice {
    background: var(--notice-bg);
    border: 1px solid var(--notice-bd);
    color: var(--notice-tx);
    padding: 13px 18px;
    margin: 18px 22px 0;
    border-radius: 14px;
    font-size: 13.5px;
    display: none;
    align-items: center;
    gap: 10px;
}

/* Admin Info */
.admin-info-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin: 14px 22px 0;
    font-size: 13px;
    line-height: 1.7;
    display: none;
}
.admin-info-box .title {
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
    font-size: 14px;
}
.admin-info-box a { color: var(--primary); text-decoration: none; }

/* Content */
.content { padding: 22px; }

.section-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.section-title i { color: var(--primary); }

.theme-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--badge-bg);
    color: var(--badge-tx);
    border: 1px solid var(--border);
    margin-left: 8px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
}

/* Different grid per theme */
[data-theme="gold-premium"] .grid {
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
}
[data-theme="cyber-punk"] .grid {
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px;
}
[data-theme="neon-night"] .grid {
    gap: 18px;
}

.card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: all 0.28s ease;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    position: relative;
    overflow: hidden;
}

.card:hover {
    transform: var(--card-hover);
    border-color: var(--primary);
}

/* Theme card accents */
[data-theme="neon-night"] .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--primary), var(--primary2));
}
[data-theme="gold-premium"] .card {
    border: 1px solid rgba(255,200,0,0.25);
}
[data-theme="gold-premium"] .card:hover {
    box-shadow: 0 12px 40px rgba(255,200,0,0.15);
}
[data-theme="cyber-punk"] .card {
    border-left: 3px solid var(--primary);
}
[data-theme="cyber-punk"] .card:hover {
    border-left-color: var(--primary2);
    box-shadow: 0 0 25px rgba(0,240,255,0.15);
}
[data-theme="emerald-light"] .card:hover {
    box-shadow: 0 12px 28px rgba(13,148,136,0.12);
}

.icon {
    width: 50px; height: 50px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 14px;
}

[data-theme="cyber-punk"] .icon { border-radius: 6px; }
[data-theme="gold-premium"] .icon { border-radius: 50%; }

.card h3 {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 5px;
}

.card p {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.45;
}

/* Overlay mobile */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 90;
}

@media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .menu-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .overlay.show { display: block; }
}
</style>
<script>
/* Early theme – no flash */
(function(){
  var t = localStorage.getItem('a_tuls_dash_color') || localStorage.getItem('a_tuls_theme') || 'dark-ocean';
  var ok = ['dark-ocean','neon-night','gold-premium','cyber-punk','emerald-light'];
  document.documentElement.setAttribute('data-theme', ok.indexOf(t) >= 0 ? t : 'dark-ocean');
})();
</script>

/* ===== Session: 10 min inactivity → login (data never auto-deleted) ===== */
(function(){
  var ROLE_KEY = 'a_tuls_role';
  var USER_KEY = 'a_tuls_user';
  var ACT_KEY = 'a_tuls_last_active';
  var MAX_IDLE = 10 * 60 * 1000; // 10 minutes

  function touch() {
    try { localStorage.setItem(ACT_KEY, String(Date.now())); } catch(e) {}
  }

  function checkSession() {
    var role = localStorage.getItem(ROLE_KEY);
    if (!role || role === '') return false;
    var last = parseInt(localStorage.getItem(ACT_KEY) || '0', 10);
    if (!last || (Date.now() - last) > MAX_IDLE) {
      // Session expired — only clear local session, NEVER delete cloud user data
      localStorage.removeItem(ROLE_KEY);
      localStorage.removeItem(USER_KEY);
      localStorage.removeItem(ACT_KEY);
      return false;
    }
    touch();
    return true;
  }

  // Expose for pages
  window.A_TULS_TOUCH = touch;
  window.A_TULS_CHECK_SESSION = checkSession;

  // Activity listeners
  var _touchTimer = null;
  function touchDebounced() {
    if (_touchTimer) return;
    _touchTimer = setTimeout(function(){ _touchTimer = null; touch(); }, 2000);
  }
  ['click','keydown','touchstart'].forEach(function(ev){
    document.addEventListener(ev, touchDebounced, { passive: true });
  });
  setInterval(function(){
    var role = localStorage.getItem(ROLE_KEY);
    if (!role) return;
    var last = parseInt(localStorage.getItem(ACT_KEY) || '0', 10);
    if (!last || (Date.now() - last) > MAX_IDLE) {
      localStorage.removeItem(ROLE_KEY);
      localStorage.removeItem(USER_KEY);
      localStorage.removeItem(ACT_KEY);
      location.replace('index.html');
    }
  }, 30000);
})();

/* ========== DEVICE FINGERPRINT ========== */
function getBrowserName() {
    const ua = navigator.userAgent;
    if (ua.includes('Edg/')) return 'Edge ' + (ua.match(/Edg\/([\d.]+)/)?.[1] || '');
    if (ua.includes('Chrome/') && !ua.includes('Edg/')) return 'Chrome ' + (ua.match(/Chrome\/([\d.]+)/)?.[1] || '');
    if (ua.includes('Firefox/')) return 'Firefox ' + (ua.match(/Firefox\/([\d.]+)/)?.[1] || '');
    if (ua.includes('Safari/') && !ua.includes('Chrome')) return 'Safari ' + (ua.match(/Version\/([\d.]+)/)?.[1] || '');
    if (ua.includes('OPR/') || ua.includes('Opera')) return 'Opera';
    return 'Unknown Browser';
}

function getOS() {
    const ua = navigator.userAgent;
    if (ua.includes('Windows NT 10')) return 'Windows 10/11';
    if (ua.includes('Windows')) return 'Windows';
    if (ua.includes('Android')) return 'Android ' + (ua.match(/Android ([\d.]+)/)?.[1] || '');
    if (ua.includes('iPhone') || ua.includes('iPad')) return 'iOS ' + (ua.match(/OS ([\d_]+)/)?.[1]?.replace(/_/g, '.') || '');
    if (ua.includes('Mac OS X')) return 'macOS ' + (ua.match(/Mac OS X ([\d_]+)/)?.[1]?.replace(/_/g, '.') || '');
    if (ua.includes('Linux')) return 'Linux';
    return 'Unknown OS';
}

function getDeviceType() {
    const ua = navigator.userAgent;
    if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) {
        if (/iPad|Tablet/i.test(ua)) return 'Tablet';
        return 'Mobile';
    }
    return 'Desktop';
}

function simpleHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
    }
    return Math.abs(h).toString(36);
}

function getFingerprint() {
    const parts = [
        navigator.userAgent,
        navigator.language,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || 0,
        navigator.platform || ''
    ].join('|');
    return simpleHash(parts);
}

async function getIP() {
    try {
        const r = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(4000) });
        if (r.ok) {
            const d = await r.json();
            return d.ip || 'N/A';
        }
    } catch (e) {}
    return 'N/A';
}

async function collectDeviceInfo() {
    const ip = await getIP();
    return {
        fingerprint: getFingerprint(),
        browser: getBrowserName(),
        os: getOS(),
        deviceType: getDeviceType(),
        ip: ip,
        lastSeen: new Date().toISOString()
    };
}

/* ========== ULTRA TRACKING ========== */
async function recordTracking() {
    if (role === 'admin' || trackingDone || !user || !user.email) return;
    trackingDone = true;

    try {
        deviceInfo = await collectDeviceInfo();
        if (!DB) DB = await fetchDB();
        if (!DB.users) DB.users = [];

        const idx = DB.users.findIndex(u =>
            (u.email || '').toLowerCase() === (user.email || '').toLowerCase()
        );
        if (idx === -1) return;

        const u = DB.users[idx];

        // Ensure tracking fields
        if (!Array.isArray(u.devices)) u.devices = [];
        if (!Array.isArray(u.loginHistory)) u.loginHistory = [];
        if (!Array.isArray(u.blockedDevices)) u.blockedDevices = [];
        if (!u.toolUsage || typeof u.toolUsage !== 'object') u.toolUsage = {};
        if (!u.totalSessions) u.totalSessions = 0;

        // Blocked device check
        if (u.blockedDevices.includes(deviceInfo.fingerprint)) {
            alert('⛔ এই ডিভাইস/ব্রাউজার Admin কর্তৃক ব্লক করা হয়েছে।\nআপনি এই ডিভাইস থেকে লগইন করতে পারবেন না।');
            localStorage.removeItem('a_tuls_role');
            localStorage.removeItem('a_tuls_user');
            location.href = 'index.html';
            return;
        }

        // Update or add device
        const existingDev = u.devices.findIndex(d => d.fingerprint === deviceInfo.fingerprint);
        if (existingDev >= 0) {
            u.devices[existingDev] = { ...u.devices[existingDev], ...deviceInfo };
        } else {
            u.devices.push(deviceInfo);
            // Keep max 15 devices
            if (u.devices.length > 15) u.devices = u.devices.slice(-15);
        }

        // Login history (max 30)
        u.loginHistory.push({
            time: deviceInfo.lastSeen,
            browser: deviceInfo.browser,
            os: deviceInfo.os,
            ip: deviceInfo.ip,
            deviceType: deviceInfo.deviceType
        });
        if (u.loginHistory.length > 30) u.loginHistory = u.loginHistory.slice(-30);

        u.lastLogin = deviceInfo.lastSeen;
        u.totalSessions = (u.totalSessions || 0) + 1;

        DB.users[idx] = u;
        user = u;
        localStorage.setItem('a_tuls_user', JSON.stringify(u));

        await saveDB();
    } catch (e) {
        console.error('Tracking error', e);
    }
}

async function trackToolUse(toolName) {
    if (role === 'admin' || !user || !user.email || !toolName) return;
    try {
        if (!DB) DB = await fetchDB();
        const idx = DB.users.findIndex(u =>
            (u.email || '').toLowerCase() === (user.email || '').toLowerCase()
        );
        if (idx === -1) return;

        if (!DB.users[idx].toolUsage || typeof DB.users[idx].toolUsage !== 'object') {
            DB.users[idx].toolUsage = {};
        }
        DB.users[idx].toolUsage[toolName] = (DB.users[idx].toolUsage[toolName] || 0) + 1;
        if (!DB.users[idx].toolLastUsed || typeof DB.users[idx].toolLastUsed !== 'object') {
            DB.users[idx].toolLastUsed = {};
        }
        DB.users[idx].toolLastUsed[toolName] = new Date().toISOString();
        DB.users[idx].lastTool = toolName;
        DB.users[idx].lastToolTime = new Date().toISOString();

        // Also refresh lastSeen on current device
        if (deviceInfo) {
            if (!Array.isArray(DB.users[idx].devices)) DB.users[idx].devices = [];
            const di = DB.users[idx].devices.findIndex(d => d.fingerprint === deviceInfo.fingerprint);
            if (di >= 0) {

            }
        }

        user = DB.users[idx];
        localStorage.setItem('a_tuls_user', JSON.stringify(user));
        await saveDB();
    } catch (e) {
        console.error('Tool track error', e);
    }
}

function filterToolsByPermission(userObj, settings) {
    const cards = document.querySelectorAll('#toolsGrid .card[data-tool]');
    const menuItems = document.querySelectorAll('.sidebar-menu .menu-item[data-tool]');

    // Admin sees everything
    if (role === 'admin') {
        cards.forEach(c => c.style.display = '');
        menuItems.forEach(m => m.style.display = '');
        return;
    }

    const globalTools = (settings && Array.isArray(settings.globalTools) && settings.globalTools.length)
        ? settings.globalTools
        : null;

    const userTools = (userObj && Array.isArray(userObj.tools)) ? userObj.tools : [];
    const mode = (userObj && userObj.mode) || 'free';

    cards.forEach(card => {
        const toolName = card.getAttribute('data-tool');
        let allowed = true;

        if (globalTools && !globalTools.includes(toolName)) {
            allowed = false;
        }

        if (userTools.length > 0) {
            if (!userTools.includes(toolName)) allowed = false;
        } else if (mode === 'free') {
            allowed = false;
        }

        card.style.display = allowed ? '' : 'none';
    });

    menuItems.forEach(item => {
        const toolName = item.getAttribute('data-tool');
        const matchingCard = document.querySelector('#toolsGrid .card[data-tool="' + toolName + '"]');
        if (matchingCard) {
            item.style.display = matchingCard.style.display;
        }
    });
}

function setActiveMenu(which) {
    document.querySelectorAll('.sidebar-menu .menu-item').forEach(el => el.classList.remove('active'));
    if (which === 'dashboard') {
        const el = document.querySelector('.sidebar-menu .menu-item[href="dashboard.html"]');
        if (el) el.classList.add('active');
    } else if (which === 'community') {
        const el = document.querySelector('.sidebar-menu .menu-item[href="#community"]');
        if (el) el.classList.add('active');
    } else if (which === 'profile') {
        const el = document.querySelector('.sidebar-menu .menu-item[href="#myProfile"]');
        if (el) el.classList.add('active');
    }
}

function onPhotoSelected(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const status = document.getElementById('profileSaveMsg');
    const showStatus = (msg, ok) => {
        if (!status) return;
        status.style.display = 'block';
        status.style.color = ok === false ? 'var(--danger-tx)' : (ok ? 'var(--primary)' : 'var(--muted)');
        status.textContent = msg;
    };

    // Accept almost any image; some Android give empty MIME
    const name = (file.name || '').toLowerCase();
    const type = (file.type || '').toLowerCase();
    const looksImage = type.startsWith('image/') || /\.(jpe?g|png|webp|gif|bmp|heic|heif|avif|tiff?)$/i.test(name) || type === '';
    if (!looksImage && type && !type.startsWith('image/')) {
        showStatus((typeof t === 'function' ? t('photo_only') : null) || 'Please select a photo', false);
        return;
    }

    showStatus((typeof t === 'function' ? t('photo_processing') : null) || 'Processing photo...', null);

    const processBitmap = (bitmapOrImg, w, h) => {
        try {
            const width = w || bitmapOrImg.width || 1;
            const height = h || bitmapOrImg.height || 1;
            const size = Math.min(width, height);
            const sx = (width - size) / 2;
            const sy = (height - size) / 2;
            // Always small square for stable JSONBin save
            let out = 160;
            const c = document.createElement('canvas');
            c.width = out;
            c.height = out;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, out, out);
            if (typeof createImageBitmap !== 'undefined' && bitmapOrImg.close) {
                ctx.drawImage(bitmapOrImg, sx, sy, size, size, 0, 0, out, out);
                try { bitmapOrImg.close(); } catch (e) {}
            } else {
                ctx.drawImage(bitmapOrImg, sx, sy, size, size, 0, 0, out, out);
            }
            let q = 0.7;
            let data = c.toDataURL('image/jpeg', q);
            // Hard cap ~50–70KB so save never fails
            while (data.length > 70000 && q > 0.3) {
                q -= 0.1;
                data = c.toDataURL('image/jpeg', q);
            }
            if (data.length > 90000) {
                out = 120;
                c.width = out; c.height = out;
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, out, out);
                ctx.drawImage(bitmapOrImg.width ? bitmapOrImg : bitmapOrImg, sx, sy, size, size, 0, 0, out, out);
                data = c.toDataURL('image/jpeg', 0.55);
            }
            profilePhotoData = data;
            updatePhotoUI();
            showStatus((typeof t === 'function' ? t('photo_ready') : null) || '✅ Photo ready — press Save Profile', true);
        } catch (err) {
            console.error(err);
            showStatus((typeof t === 'function' ? t('photo_fail') : null) || 'Photo failed', false);
        }
    };

    // Path 1: createImageBitmap (best for large phone photos)
    if (typeof createImageBitmap === 'function') {
        createImageBitmap(file)
            .then(function(bmp) {
                processBitmap(bmp, bmp.width, bmp.height);
            })
            .catch(function() {
                // Path 2: FileReader + Image
                fallbackReader();
            });
    } else {
        fallbackReader();
    }

    function fallbackReader() {
        const reader = new FileReader();
        reader.onload = function(ev) {
            const img = new Image();
            img.onload = function() { processBitmap(img, img.width, img.height); };
            img.onerror = function() {
                showStatus((typeof t === 'function' ? t('photo_fail') : null) || 'Could not read this photo. Try JPG or PNG.', false);
            };
            img.src = ev.target.result;
        };
        reader.onerror = function() {
            showStatus((typeof t === 'function' ? t('photo_fail') : null) || 'Could not read file', false);
        };
        try {
            reader.readAsDataURL(file);
        } catch (e) {
            showStatus((typeof t === 'function' ? t('photo_fail') : null) || 'Could not read file', false);
        }
    }
}

function escapeHtmlLocal(str) {
    return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function onPostPhotoSelected(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { alert('শুধু ছবি'); return; }
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function() {
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let q = 0.8;
        postPhotoData = c.toDataURL('image/jpeg', q);
        while (postPhotoData.length > 120000 && q > 0.35) {
            q -= 0.1;
            postPhotoData = c.toDataURL('image/jpeg', q);
        }
        URL.revokeObjectURL(url);
        document.getElementById('postPhotoName').textContent = file.name;
        document.getElementById('postPhotoPreview').src = postPhotoData;
        document.getElementById('postPhotoPreviewWrap').style.display = 'block';
    };
    img.src = url;
}

async function createPost() {
    const text = (document.getElementById('postText').value || '').trim();
    const type = document.getElementById('postType').value;
    const price = (document.getElementById('postPrice').value || '').trim();
    if (!text && !postPhotoData) return alert('টেক্সট বা ছবি দিন');

    const me = (user && user.email) || (role === 'admin' ? 'admin@atuls.local' : '');
    const myName = (user && user.name) || (role === 'admin' ? 'Admin Gourab' : 'User');
    if (!me) return alert('লগইন প্রয়োজন');

    try {
        if (!DB) DB = await fetchDB();
        if (!Array.isArray(DB.posts)) DB.posts = [];
        DB.posts.unshift({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
            authorEmail: me,
            authorName: myName,
            type: type,
            text: text,
            price: (type === 'sell' || type === 'buy') ? price : '',
            photo: postPhotoData || '',
            likes: [],
            comments: [],
            time: new Date().toISOString()
        });
        if (DB.posts.length > 200) DB.posts = DB.posts.slice(0, 200);
        await saveDB();
        document.getElementById('postText').value = '';
        document.getElementById('postPrice').value = '';
        postPhotoData = '';
        document.getElementById('postPhotoName').textContent = '';
        document.getElementById('postPhotoPreviewWrap').style.display = 'none';
        const pi = document.getElementById('postPhoto');
        if (pi) pi.value = '';
        renderPostsFeed();
    } catch (e) {
        alert('পোস্ট ব্যর্থ: ' + e.message);
    }
}

                    ${canDel ? `<button onclick="deleteComment('${post.id}',${realIdx})" style="background:none;border:none;color:var(--danger-tx);cursor:pointer;font-size:11px;flex-shrink:0;" title="Delete"><i class="fas fa-times"></i></button>` : ''}
                </div>`;
            }).join('');

            return `
            <div class="card" style="cursor:default;padding:16px;" id="post-${post.id}">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <div style="font-weight:700;font-size:14px;">${escapeHtmlLocal(post.authorName || 'User')}</div>
                    ${typeBadge}
                </div>
                <div style="font-size:11px;color:var(--muted);margin-bottom:8px;">${time}</div>
                <div style="font-size:14px;line-height:1.55;white-space:pre-wrap;">${escapeHtmlLocal(post.text || '')}</div>
                ${priceHtml}
                ${photoHtml}
                <div style="display:flex;gap:14px;margin-top:12px;align-items:center;flex-wrap:wrap;">
                    <button onclick="toggleLike('${post.id}')" class="logout-btn" style="border:1px solid var(--border);font-size:12px;padding:6px 12px;${liked ? 'background:var(--primary);color:#000;border:none;' : ''}">
                        <i class="fas fa-heart"></i> ${likes.length}
                    </button>
                    <span style="font-size:12px;color:var(--muted);"><i class="fas fa-comment"></i> ${comments.length}</span>
                    <button onclick="openChat('${escapeHtmlLocal(post.authorEmail)}','${escapeHtmlLocal(post.authorName || 'User')}')" class="logout-btn" style="border:1px solid var(--border);font-size:12px;padding:6px 12px;margin-left:auto;">
                        <i class="fas fa-comments"></i> Chat
                    </button>
                    ${(post.authorEmail || '').toLowerCase() === me || role === 'admin' ? `<button onclick="deletePost('${post.id}')" class="logout-btn" style="border:1px solid var(--danger-bd);color:var(--danger-tx);font-size:12px;padding:6px 12px;"><i class="fas fa-trash"></i> Delete</button>` : ''}
                </div>
                <div style="margin-top:10px;">
                    ${commentsHtml}
                    <div style="display:flex;gap:8px;margin-top:8px;">
                        <input type="text" id="cmt-${post.id}" placeholder="কমেন্ট লিখুন..." style="flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-family:inherit;font-size:13px;">
                        <button onclick="addComment('${post.id}')" class="logout-btn" style="background:var(--primary);color:#000;border:none;font-size:12px;padding:6px 12px;">Send</button>
                    </div>
                </div>
            </div>`;
        }).join('');
    } catch (e) {
        feed.innerHTML = '<div style="color:var(--danger-tx);">ফিড লোড ব্যর্থ</div>';
    }
}


async function deletePost(postId) {
    if (!confirm('এই পোস্ট ডিলিট করবেন?')) return;
    const me = ((user && user.email) || (role === 'admin' ? 'admin@atuls.local' : '')).toLowerCase();
    try {
        if (!DB) DB = await fetchDB();
        const post = (DB.posts || []).find(p => p.id === postId);
        if (!post) return;
        const author = (post.authorEmail || '').toLowerCase();
        if (author !== me && role !== 'admin') {
            alert('শুধু নিজের পোস্ট ডিলিট করতে পারবেন');
            return;
        }
        DB.posts = DB.posts.filter(p => p.id !== postId);
        await saveDB();
        renderPostsFeed();
    } catch (e) {
        alert('ডিলিট ব্যর্থ');
    }
}

async function deleteComment(postId, cmtIndex) {
    if (!confirm('কমেন্ট ডিলিট করবেন?')) return;
    const me = ((user && user.email) || (role === 'admin' ? 'admin@atuls.local' : '')).toLowerCase();
    try {
        if (!DB) DB = await fetchDB();
        const post = (DB.posts || []).find(p => p.id === postId);
        if (!post || !Array.isArray(post.comments)) return;
        const c = post.comments[cmtIndex];
        if (!c) return;
        if ((c.email || '').toLowerCase() !== me && role !== 'admin') {
            alert('শুধু নিজের কমেন্ট ডিলিট করতে পারবেন');
            return;
        }
        post.comments.splice(cmtIndex, 1);
        await saveDB();
        renderPostsFeed();
    } catch (e) {
        alert('ডিলিট ব্যর্থ');
    }
}


async function toggleLike(postId) {
    const me = ((user && user.email) || (role === 'admin' ? 'admin@atuls.local' : '')).toLowerCase();
    if (!me) return;
    try {
        if (!DB) DB = await fetchDB();
        const post = (DB.posts || []).find(p => p.id === postId);
        if (!post) return;
        if (!Array.isArray(post.likes)) post.likes = [];
        const i = post.likes.findIndex(x => (x || '').toLowerCase() === me);
        if (i >= 0) post.likes.splice(i, 1);
        else post.likes.push(me);
        await saveDB();
        renderPostsFeed();
    } catch (e) { console.error(e); }
}

async function addComment(postId) {
    const input = document.getElementById('cmt-' + postId);
    const text = (input && input.value || '').trim();
    if (!text) return;
    const me = (user && user.email) || (role === 'admin' ? 'admin@atuls.local' : '');
    const myName = (user && user.name) || (role === 'admin' ? 'Admin' : 'User');
    if (!me) return;
    try {
        if (!DB) DB = await fetchDB();
        const post = (DB.posts || []).find(p => p.id === postId);
        if (!post) return;
        if (!Array.isArray(post.comments)) post.comments = [];
        post.comments.push({ email: me, name: myName, text: text, time: new Date().toISOString() });
        if (post.comments.length > 100) post.comments = post.comments.slice(-100);
        await saveDB();
        if (input) input.value = '';
        renderPostsFeed();
    } catch (e) { alert('কমেন্ট ব্যর্থ'); }
}


/* ===== CHAT (stored in JSONBin messages array) ===== */
function openChat(email, name) {
    chatPartnerEmail = email;
    chatPartnerName = name;
    document.getElementById('chatPanel').style.display = 'block';
    document.getElementById('chatWithName').textContent = name;
    document.getElementById('chatPanel').scrollIntoView({ behavior: 'smooth' });
    loadChatMessages();
}

function closeChat() {
    document.getElementById('chatPanel').style.display = 'none';
    chatPartnerEmail = null;
}

async function loadChatMessages() {
    const box = document.getElementById('chatMessages');
    if (!box || !chatPartnerEmail) return;
    try {
        if (!DB) DB = await fetchDB();
        if (!Array.isArray(DB.messages)) DB.messages = [];

        const me = (user && user.email || (role === 'admin' ? 'admin@atuls.local' : '')).toLowerCase();
        const other = chatPartnerEmail.toLowerCase();

        const msgs = DB.messages.filter(m => {
            const f = (m.from || '').toLowerCase();
            const t = (m.to || '').toLowerCase();
            return (f === me && t === other) || (f === other && t === me);
        }).slice(-80);

        if (!msgs.length) {
            box.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px;">কোনো মেসেজ নেই। প্রথম মেসেজ পাঠান!</div>';
            return;
        }

        box.innerHTML = msgs.map(m => {
            const mine = (m.from || '').toLowerCase() === me;
            const time = m.time ? new Date(m.time).toLocaleString('bn-BD', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' }) : '';
            return `<div style="margin-bottom:10px;text-align:${mine ? 'right' : 'left'};">
                <div style="display:inline-block;max-width:80%;padding:8px 12px;border-radius:12px;background:${mine ? 'var(--primary)' : 'var(--card)'};color:${mine ? '#000' : 'var(--text)'};border:1px solid var(--border);font-size:13px;">
                    ${escapeHtmlLocal(m.text)}
                </div>
                <div style="font-size:10px;color:var(--muted);margin-top:2px;">${time}</div>
            </div>`;
        }).join('');
        box.scrollTop = box.scrollHeight;
    } catch (e) {
        box.innerHTML = '<div style="color:var(--danger-tx);">মেসেজ লোড ব্যর্থ</div>';
    }
}

async function sendChat() {
    const input = document.getElementById('chatInput');
    const text = (input.value || '').trim();
    if (!text || !chatPartnerEmail) return;

    const me = (user && user.email) || (role === 'admin' ? 'admin@atuls.local' : '');
    if (!me) return alert('লগইন প্রয়োজন');

    try {
        if (!DB) DB = await fetchDB();
        if (!Array.isArray(DB.messages)) DB.messages = [];

        DB.messages.push({
            id: Date.now().toString(36),
            from: me,
            to: chatPartnerEmail,
            text: text,
            time: new Date().toISOString()
        });
        // keep last 500 messages globally
        if (DB.messages.length > 500) DB.messages = DB.messages.slice(-500);

        await saveDB();
        input.value = '';
        await loadChatMessages();
    } catch (e) {
        alert('পাঠানো যায়নি: ' + e.message);
    }
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'chatInput') {
        sendChat();
    }
});

/* Restore tools when clicking Dashboard menu */
document.querySelectorAll('.sidebar-menu .menu-item[href="dashboard.html"]').forEach(el => {
    el.addEventListener('click', function() {
        showToolsSection();
    });
});

/* After sync, refresh community wall */
const _origSync = typeof syncFromCloud === 'function' ? syncFromCloud : null;

setInterval(syncFromCloud, 5000);
