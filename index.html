<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-tuls - √MASTER STYLES | Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #060a12;
    --card: rgba(255,255,255,0.04);
    --cyan: #00f0ff;
    --purple: #7b2fff;
    --green: #00ff9d;
    --red: #ff3b5c;
    --text: #e8f7ff;
    --muted: #8b9cb3;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
body {
    background: radial-gradient(ellipse at 30% 0%, #12182b 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.box {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    padding: 36px 28px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
}
.logo {
    text-align: center;
    font-size: 1.7rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
    letter-spacing: 1px;
}
.sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:28px; }
.tabs {
    display: flex;
    background: rgba(0,0,0,0.3);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 24px;
}
.tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    color: var(--muted);
    transition: 0.25s;
}
.tab.active {
    background: linear-gradient(135deg, var(--cyan), #00b8d4);
    color: #000;
}
input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 12px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    color: white;
    font-size: 15px;
    outline: none;
}
input:focus { border-color: var(--cyan); }
.btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--cyan), #00b8d4);
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.btn:hover { transform: translateY(-2px); }
.msg {
    margin-top: 14px;
    padding: 12px;
    border-radius: 12px;
    font-size: 13.5px;
    text-align: center;
    display: none;
}
.msg.error { background: rgba(255,59,92,0.15); color: var(--red); display:block; }
.msg.success { background: rgba(0,255,157,0.15); color: var(--green); display:block; }
.footer { text-align:center; margin-top:24px; font-size:12px; color:var(--muted); }
#registerForm { display: none; }
</style>
</head>
<body>
<div class="box">
    <div class="logo">A-tuls - √MASTER</div>
    <div class="sub">Premium Tools Platform</div>

    <div class="tabs">
        <div class="tab active" id="loginTab" onclick="showLogin()">Login</div>
        <div class="tab" id="regTab" onclick="showRegister()">Register</div>
    </div>

    <!-- Login -->
    <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email address">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="btn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Login</button>
        <div class="msg" id="loginMsg"></div>
    </div>

    <!-- Register -->
    <div id="registerForm">
        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email address">
        <input type="password" id="regPass" placeholder="Password">
        <button class="btn" onclick="doRegister()"><i class="fas fa-user-plus"></i> Create Account</button>
        <div class="msg" id="regMsg"></div>
    </div>

    <div class="footer">Developed by Gourab • 01944035239</div>
</div>

<script>
const ADMIN_EMAIL = "gourabmon112233@gmail.com";
const ADMIN_PASS  = "goUrab@2008";

function showLogin() {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('loginTab').classList.add('active');
    document.getElementById('regTab').classList.remove('active');
}
function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
    document.getElementById('regTab').classList.add('active');
    document.getElementById('loginTab').classList.remove('active');
}

function doLogin() {
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const pass  = document.getElementById('loginPass').value;
    const msg   = document.getElementById('loginMsg');

    // Admin direct login
    if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
        localStorage.setItem('a_tuls_role', 'admin');
        localStorage.setItem('a_tuls_user', JSON.stringify({name:'Admin Gourab', email:ADMIN_EMAIL, status:'Approved'}));
        window.location.href = 'admin.html';
        return;
    }

    // Normal user
    const users = JSON.parse(localStorage.getItem('a_tuls_users') || '[]');
    const user = users.find(u => u.email === email && u.password === pass);

    if (!user) {
        msg.className = 'msg error';
        msg.textContent = 'ভুল ইমেইল বা পাসওয়ার্ড!';
        return;
    }

    if (user.status === 'Pending') {
        localStorage.setItem('a_tuls_role', 'pending');
        localStorage.setItem('a_tuls_user', JSON.stringify(user));
        window.location.href = 'pending.html';
        return;
    }

    if (user.status === 'Blocked') {
        msg.className = 'msg error';
        msg.textContent = 'আপনার একাউন্ট ব্লক করা হয়েছে।';
        return;
    }

    localStorage.setItem('a_tuls_role', 'user');
    localStorage.setItem('a_tuls_user', JSON.stringify(user));
    window.location.href = 'dashboard.html';
}

function doRegister() {
    const name  = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const pass  = document.getElementById('regPass').value;
    const msg   = document.getElementById('regMsg');

    if (!name || !email || !pass) {
        msg.className = 'msg error';
        msg.textContent = 'সব ফিল্ড পূরণ করুন';
        return;
    }

    let users = JSON.parse(localStorage.getItem('a_tuls_users') || '[]');
    if (users.find(u => u.email === email)) {
        msg.className = 'msg error';
        msg.textContent = 'এই ইমেইল ইতিমধ্যে রেজিস্টার্ড';
        return;
    }

    users.push({
        id: Date.now().toString(36),
        name, email, password: pass,
        status: 'Pending',
        created: new Date().toISOString(),
        tools: []
    });
    localStorage.setItem('a_tuls_users', JSON.stringify(users));

    msg.className = 'msg success';
    msg.textContent = 'রেজিস্ট্রেশন সফল! অ্যাডমিন অ্যাপ্রুভের জন্য অপেক্ষা করুন।';
    setTimeout(() => {
        localStorage.setItem('a_tuls_role', 'pending');
        localStorage.setItem('a_tuls_user', JSON.stringify(users[users.length-1]));
        window.location.href = 'pending.html';
    }, 1500);
}
</script>
</body>
</html>
