<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-tuls - √MASTER STYLES | Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #060a12;
    --card: rgba(255,255,255,0.04);
    --cyan: #00f0ff;
    --purple: #7b2fff;
    --green: #00ff9d;
    --red: #ff3b5c;
    --text: #e8f7ff;
    --muted: #8b9cb3;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
body {
    background: radial-gradient(ellipse at 30% 0%, #12182b 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.box {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    padding: 36px 28px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
}
.logo {
    text-align: center;
    font-size: 1.7rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
    letter-spacing: 1px;
}
.sub { text-align:center; color:var(--muted); font-size:13px; margin-bottom:28px; }
.tabs {
    display: flex;
    background: rgba(0,0,0,0.3);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 24px;
}
.tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    color: var(--muted);
    transition: 0.25s;
}
.tab.active {
    background: linear-gradient(135deg, var(--cyan), #00b8d4);
    color: #000;
}
input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 12px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    color: white;
    font-size: 15px;
    outline: none;
}
input:focus { border-color: var(--cyan); }
.btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--cyan), #00b8d4);
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.btn:hover:not(:disabled) { transform: translateY(-2px); }
.msg {
    margin-top: 14px;
    padding: 12px;
    border-radius: 12px;
    font-size: 13.5px;
    text-align: center;
    display: none;
}
.msg.error { background: rgba(255,59,92,0.15); color: var(--red); display:block; }
.msg.success { background: rgba(0,255,157,0.15); color: var(--green); display:block; }
.footer { text-align:center; margin-top:24px; font-size:12px; color:var(--muted); }
#registerForm { display: none; }
.loading { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="box">
    <div class="logo">A-tuls - √MASTER</div>
    <div class="sub">Premium Tools Platform</div>

    <div class="tabs">
        <div class="tab active" id="loginTab" onclick="showLogin()">Login</div>
        <div class="tab" id="regTab" onclick="showRegister()">Register</div>
    </div>

    <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email address">
        <input type="password" id="loginPass" placeholder="Password">
        <button class="btn" id="loginBtn" onclick="doLogin()"><i class="fas fa-sign-in-alt"></i> Login</button>
        <div class="msg" id="loginMsg"></div>
        <div class="loading" id="loginLoading">লোড হচ্ছে...</div>
    </div>

    <div id="registerForm">
        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email address">
        <input type="password" id="regPass" placeholder="Password">
        <button class="btn" id="regBtn" onclick="doRegister()"><i class="fas fa-user-plus"></i> Create Account</button>
        <div class="msg" id="regMsg"></div>
        <div class="loading" id="regLoading">সেভ হচ্ছে...</div>
    </div>

    <div class="footer">Developed by Gourab • 01944035239</div>
</div>

<script>
/* ========== JSONBin Config ========== */
const BIN_ID = '6a6eb29dda38895dfeae700a';
const MASTER_KEY = '$2a$10$GzWaV3W/AAwOB454.aieN.f04H/PIoDF0RFCqAUPrNxIr0OGg13qW';
const BIN_URL = 'https://api.jsonbin.io/v3/b/' + BIN_ID;

const ADMIN_EMAIL = 'gourabmon112233@gmail.com';
const ADMIN_PASS  = 'goUrab@2008';

/* ========== DEVICE HELPERS (Ultra Tracking) ========== */
function getBrowserName() {
    const ua = navigator.userAgent;
    if (ua.includes('Edg/')) return 'Edge ' + (ua.match(/Edg\/([\d.]+)/)?.[1] || '');
    if (ua.includes('Chrome/') && !ua.includes('Edg/')) return 'Chrome ' + (ua.match(/Chrome\/([\d.]+)/)?.[1] || '');
    if (ua.includes('Firefox/')) return 'Firefox ' + (ua.match(/Firefox\/([\d.]+)/)?.[1] || '');
    if (ua.includes('Safari/') && !ua.includes('Chrome')) return 'Safari ' + (ua.match(/Version\/([\d.]+)/)?.[1] || '');
    if (ua.includes('OPR/') || ua.includes('Opera')) return 'Opera';
    return 'Unknown Browser';
}

function getOS() {
    const ua = navigator.userAgent;
    if (ua.includes('Windows NT 10')) return 'Windows 10/11';
    if (ua.includes('Windows')) return 'Windows';
    if (ua.includes('Android')) return 'Android ' + (ua.match(/Android ([\d.]+)/)?.[1] || '');
    if (ua.includes('iPhone') || ua.includes('iPad')) return 'iOS ' + (ua.match(/OS ([\d_]+)/)?.[1]?.replace(/_/g, '.') || '');
    if (ua.includes('Mac OS X')) return 'macOS ' + (ua.match(/Mac OS X ([\d_]+)/)?.[1]?.replace(/_/g, '.') || '');
    if (ua.includes('Linux')) return 'Linux';
    return 'Unknown OS';
}

function getDeviceType() {
    const ua = navigator.userAgent;
    if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) {
        if (/iPad|Tablet/i.test(ua)) return 'Tablet';
        return 'Mobile';
    }
    return 'Desktop';
}

function simpleHash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
    }
    return Math.abs(h).toString(36);
}

function getFingerprint() {
    const parts = [
        navigator.userAgent,
        navigator.language,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || 0,
        navigator.platform || ''
    ].join('|');
    return simpleHash(parts);
}

async function getIP() {
    try {
        const r = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(4000) });
        if (r.ok) {
            const d = await r.json();
            return d.ip || 'N/A';
        }
    } catch (e) {}
    return 'N/A';
}

async function collectDeviceInfo() {
    const ip = await getIP();
    return {
        fingerprint: getFingerprint(),
        browser: getBrowserName(),
        os: getOS(),
        deviceType: getDeviceType(),
        ip: ip,
        lastSeen: new Date().toISOString()
    };
}

async function fetchDB() {
    const res = await fetch(BIN_URL + '/latest', {
        headers: { 'X-Master-Key': MASTER_KEY }
    });
    if (!res.ok) throw new Error('DB load failed: ' + res.status);
    const data = await res.json();
    return data.record || { users: [], settings: {} };
}

async function saveDB(db) {
    const res = await fetch(BIN_URL, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
        },
        body: JSON.stringify(db)
    });
    if (!res.ok) throw new Error('DB save failed: ' + res.status);
    return await res.json();
}

function showLogin() {
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('loginTab').classList.add('active');
    document.getElementById('regTab').classList.remove('active');
}
function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
    document.getElementById('regTab').classList.add('active');
    document.getElementById('loginTab').classList.remove('active');
}

async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim().toLowerCase();
    const pass  = document.getElementById('loginPass').value;
    const msg   = document.getElementById('loginMsg');
    const btn   = document.getElementById('loginBtn');
    const loading = document.getElementById('loginLoading');

    msg.className = 'msg';
    msg.style.display = 'none';

    if (!email || !pass) {
        msg.className = 'msg error';
        msg.textContent = 'ইমেইল ও পাসওয়ার্ড দিন';
        return;
    }

    // Admin direct login (no cloud needed)
    if (email === ADMIN_EMAIL && pass === ADMIN_PASS) {
        localStorage.setItem('a_tuls_role', 'admin');
        localStorage.setItem('a_tuls_user', JSON.stringify({
            name: 'Admin Gourab', email: ADMIN_EMAIL, status: 'Approved', mode: 'premium'
        }));
        window.location.href = 'admin.html';
        return;
    }

    btn.disabled = true;
    loading.style.display = 'block';

    try {
        const db = await fetchDB();

        // Site live check
        if (db.settings && db.settings.siteLive === false) {
            msg.className = 'msg error';
            msg.textContent = 'সাইট সাময়িক বন্ধ আছে। পরে চেষ্টা করুন।';
            return;
        }

        const users = db.users || [];
        const userIdx = users.findIndex(u => (u.email || '').toLowerCase() === email && u.password === pass);

        if (userIdx === -1) {
            msg.className = 'msg error';
            msg.textContent = 'ভুল ইমেইল বা পাসওয়ার্ড!';
            return;
        }

        let user = users[userIdx];

        // Ensure tracking fields exist
        if (!Array.isArray(user.devices)) user.devices = [];
        if (!Array.isArray(user.loginHistory)) user.loginHistory = [];
        if (!Array.isArray(user.blockedDevices)) user.blockedDevices = [];
        if (!user.toolUsage || typeof user.toolUsage !== 'object') user.toolUsage = {};
        if (!user.totalSessions) user.totalSessions = 0;

        // Collect device & check block BEFORE allowing login
        const deviceInfo = await collectDeviceInfo();

        if (user.blockedDevices.includes(deviceInfo.fingerprint)) {
            msg.className = 'msg error';
            msg.textContent = '⛔ এই ডিভাইস/ব্রাউজার Admin কর্তৃক ব্লক করা হয়েছে। লগইন সম্ভব নয়।';
            return;
        }

        if (user.status === 'Pending') {
            localStorage.setItem('a_tuls_role', 'pending');
            localStorage.setItem('a_tuls_user', JSON.stringify(user));
            window.location.href = 'pending.html';
            return;
        }

        if (user.status === 'Blocked') {
            msg.className = 'msg error';
            msg.textContent = 'আপনার একাউন্ট ব্লক করা হয়েছে।';
            return;
        }

        // Record login tracking
        const existingDev = user.devices.findIndex(d => d.fingerprint === deviceInfo.fingerprint);
        if (existingDev >= 0) {
            user.devices[existingDev] = { ...user.devices[existingDev], ...deviceInfo };
        } else {
            user.devices.push(deviceInfo);
            if (user.devices.length > 15) user.devices = user.devices.slice(-15);
        }

        user.loginHistory.push({
            time: deviceInfo.lastSeen,
            browser: deviceInfo.browser,
            os: deviceInfo.os,
            ip: deviceInfo.ip,
            deviceType: deviceInfo.deviceType
        });
        if (user.loginHistory.length > 30) user.loginHistory = user.loginHistory.slice(-30);

        user.lastLogin = deviceInfo.lastSeen;
        user.totalSessions = (user.totalSessions || 0) + 1;

        db.users[userIdx] = user;
        await saveDB(db);

        localStorage.setItem('a_tuls_role', 'user');
        localStorage.setItem('a_tuls_user', JSON.stringify(user));
        window.location.href = 'dashboard.html';
    } catch (e) {
        msg.className = 'msg error';
        msg.textContent = 'নেটওয়ার্ক এরর! আবার চেষ্টা করুন।';
        console.error(e);
    } finally {
        btn.disabled = false;
        loading.style.display = 'none';
    }
}

async function doRegister() {
    const name  = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const pass  = document.getElementById('regPass').value;
    const msg   = document.getElementById('regMsg');
    const btn   = document.getElementById('regBtn');
    const loading = document.getElementById('regLoading');

    msg.className = 'msg';
    msg.style.display = 'none';

    if (!name || !email || !pass) {
        msg.className = 'msg error';
        msg.textContent = 'সব ফিল্ড পূরণ করুন';
        return;
    }

    if (pass.length < 4) {
        msg.className = 'msg error';
        msg.textContent = 'পাসওয়ার্ড কমপক্ষে ৪ অক্ষর হতে হবে';
        return;
    }

    btn.disabled = true;
    loading.style.display = 'block';

    try {
        const db = await fetchDB();
        if (!db.users) db.users = [];
        if (!db.settings) {
            db.settings = {
                theme: 'dark-ocean',
                adminInfoVisible: true,
                registrationOpen: true,
                siteLive: true,
                notice: '',
                globalTools: [
                    'Duplicate Checker', 'Data Formatter', 'Report Generator',
                    'Email Validator', 'Email Vault', 'Names & Recovery',
                    'Password Generator', 'IP TimeZone Finder', 'Gmail format fixer'
                ]
            };
        }

        if (db.settings.siteLive === false) {
            msg.className = 'msg error';
            msg.textContent = 'সাইট সাময়িক বন্ধ আছে।';
            return;
        }

        if (db.settings.registrationOpen === false) {
            msg.className = 'msg error';
            msg.textContent = 'রেজিস্ট্রেশন এখন বন্ধ আছে!';
            return;
        }

        if (db.users.find(u => (u.email || '').toLowerCase() === email)) {
            msg.className = 'msg error';
            msg.textContent = 'এই ইমেইল ইতিমধ্যে রেজিস্টার্ড';
            return;
        }

        // Collect device for new user
        const deviceInfo = await collectDeviceInfo();

        const newUser = {
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            name,
            email,
            password: pass,
            status: 'Pending',
            mode: 'free',
            tools: [],
            joined: new Date().toLocaleDateString('en-GB'),
            created: new Date().toISOString(),
            // Ultra Tracking fields
            devices: [deviceInfo],
            blockedDevices: [],
            loginHistory: [{
                time: deviceInfo.lastSeen,
                browser: deviceInfo.browser,
                os: deviceInfo.os,
                ip: deviceInfo.ip,
                deviceType: deviceInfo.deviceType
            }],
            toolUsage: {},
            lastLogin: deviceInfo.lastSeen,
            totalSessions: 1,
            profile: {
                photo: '',
                bio: '',
                phone: '',
                publicMessage: '',
                showOnHome: true
            }
        };

        db.users.push(newUser);
        await saveDB(db);

        msg.className = 'msg success';
        msg.textContent = 'রেজিস্ট্রেশন সফল! অ্যাডমিন অ্যাপ্রুভের জন্য অপেক্ষা করুন।';

        setTimeout(() => {
            localStorage.setItem('a_tuls_role', 'pending');
            localStorage.setItem('a_tuls_user', JSON.stringify(newUser));
            window.location.href = 'pending.html';
        }, 1200);
    } catch (e) {
        msg.className = 'msg error';
        msg.textContent = 'নেটওয়ার্ক এরর! আবার চেষ্টা করুন।';
        console.error(e);
    } finally {
        btn.disabled = false;
        loading.style.display = 'none';
    }
}
</script>
</body>
</html>
